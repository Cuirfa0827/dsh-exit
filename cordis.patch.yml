# dsh-exit bundle patch: mounts the plugin into a profile layer stack.
#
# 行配置（config）可用 profile 的 cordis.patch.yml 覆盖，例如启用
# “关闭最后一个窗口自动退出服务”：
#
#   - id: sidebar-exit
#     config:
#       exitOnWindowClose: true
#
- insert:
    - id: sidebar-exit
      name: 'dsh-exit'
      config:
        # 关闭最后一个浏览器窗口/标签页后自动退出 DSH 服务进程。
        # 开启时，每个打开的页面都会向宿主发送心跳；最后一个页面关闭
        # （约 12 秒内无心跳）后宿主自动优雅退出。刷新页面不会触发退出
        # （新页面会重新注册心跳）。默认关闭 —— 避免用户只是关掉一个
        # 标签页就意外停掉服务。
        exitOnWindowClose: false
